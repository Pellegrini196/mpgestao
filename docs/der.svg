 y="613" class="small">criado_em TIMESTAMP</text><text x="40" y="645" class="small">PK: id</text><rect x="440" y="400" width="380" height="285" rx="10" fill="#0b1710" stroke="#395a43"/><text x="455" y="430" class="title">produtos</text><text x="455" y="463" class="small">id INT U AI PK</text><text x="455" y="493" class="small">usuario_id INT U</text><text x="455" y="523" class="small">fornecedor_id INT U</text><text x="455" y="553" class="small">nome VARCHAR(100)</text><text x="455" y="583" class="small">descricao VARCHAR(500)</text><text x="455" y="613" class="small">preco DECIMAL(10,2)</text><text x="455" y="643" class="small">criado_em TIMESTAMP</text><text x="455" y="675" class="small">PK: id</text><rect x="860" y="400" width="380" height="195" rx="10" fill="#0b1710" stroke="#395a43"/><text x="875" y="430" class="title">cestas</text><text x="875" y="463" class="small">id INT U AI PK</text><text x="875" y="493" class="small">usuario_id INT U</text><text x="875" y="523" class="small">nome VARCHAR(100)</text><text x="875" y="553" class="small">criado_em TIMESTAMP</text><text x="875" y="585" class="small">PK: id</text><rect x="690" y="870" width="380" height="195" rx="10" fill="#0b1710" stroke="#395a43"/><text x="705" y="900" class="title">cesta_produtos</text><text x="705" y="933" class="small">cesta_id INT U</text><text x="705" y="963" class="small">produto_id INT U</text><text x="705" y="993" class="small">usuario_id INT U</text><text x="705" y="1023" class="small">adicionado_em TIMESTAMP</text><text x="705" y="1055" class="small">PK composta: cesta_id + produto_id</text><text x="25" y="1155" class="small">FKs de produto e cesta_produtos incluem usuario_id para garantir o mesmo proprietário. DDL completo: database/schema.sql</text></svg>
