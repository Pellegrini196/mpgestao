services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mpgestao_local_only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmpgestao_local_only"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: mini_produtos
      DB_USER: root
      DB_PASSWORD: mpgestao_local_only
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
